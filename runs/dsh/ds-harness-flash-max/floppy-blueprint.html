<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

<script>
'use strict';

/* ============================================================================
 * 3.5" FLOPPY DISK — 工程蓝图爆炸图 (Blueprint Exploded View)
 * ----------------------------------------------------------------------------
 * 设计要点:
 *  - OrthographicCamera 等距视角, position(100,80,100), lookAt(0,0,0)
 *  - 蓝图线框美学: EdgesGeometry + LineSegments, 工程蓝 #4169E1
 *  - 半透明幽灵填充: 组装态 opacity=1, 爆炸态 0.08 (磁片/主轴盘 0.5)
 *  - SHUTTER 例外: 不透明金属板 (#4a5568), 永不半透明
 *  - 磁头通道: TOP SHELL(d) / BOTTOM SHELL(g) / SHUTTER 窗口共用 HEAD_CHANNEL
 *    同一套尺寸与局部坐标, 组装态三处对齐共线
 *
 * ── 快门与开孔自检 ─────────────────────────────────────────────
 *  1. SHUTTER 本体为不透明金属感 (MeshBasicMaterial #4a5568, transparent=false),
 *     非半透明幽灵面; 爆炸态仍保持不透明, 仅随 Group 位移。
 *  2. SHUTTER 上为矩形真镂空 (Shape + holes + ExtrudeGeometry),
 *     偏左: 窗口 X∈[-10,-4] (板面 X∈[-11,11], 组中心 x=0);
 *     开孔短边(6, 沿X)与快门长边(22, 沿X)平行, 长边(14, 沿Z)与快门短边(16, 沿Z)平行。
 *  3. TOP SHELL(d) 与 BOTTOM SHELL(g) 的贯穿孔与快门窗口共用 HEAD_CHANNEL
 *     { x:-10, w:6, z:15, h:14 }, 组装态下三处 XZ 足迹完全重合 (同一磁头通道)。
 * ========================================================================== */

/* ================= 常量 ================= */
const BLUE         = 0x4169E1;  // 工程蓝（所有线框/标注）
const FILL_BLUE    = 0xdbe6ff;  // 蓝白幽灵填充
const DISK_BLUE    = 0x7b9df8;  // 磁片实体蓝
const DISK_EDGE    = 0x2b4a9b;  // 磁片深蓝描边
const SHUTTER_GRAY = 0x4a5568;  // 快门不透明金属深蓝灰
const TRACK_BLUE   = 0xa9c2fa;  // 磁道反光短线

/* 磁头通道: 上壳(d) / 下壳(g) / 快门窗口 三处共用的同一套参数 (组装态 XZ 足迹) */
const HEAD_CHANNEL = { x: -10, w: 6, z: 15, h: 14 };

const EXPLODE_DURATION = 3000;  // 爆炸总时长 ~3s
const STAGGER_MS       = 80;    // 自上而下错峰启动间隔

/* ================= 工具函数 ================= */
function deg2rad(d) { return d * Math.PI / 180; }
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOutCubic(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
function v2(x, y) { return new THREE.Vector2(x, y); }
function v3(x, y, z) { return new THREE.Vector3(x, y, z); }

/* 材质工厂 */
function ghostFill(color = FILL_BLUE) {
  // transparent 恒为 true: 组装态 opacity=1 视觉不透明, 避免切换时重编译着色器
  return new THREE.MeshBasicMaterial({ color, transparent: true, depthWrite: false, opacity: 1 });
}
function lineMat(color = BLUE, opacity = 1) {
  // 线框材质: 不写深度 + renderOrder 提升, 保证始终绘制在填充之上
  return new THREE.LineBasicMaterial({ color, transparent: true, depthWrite: false, opacity });
}
const EDGE_MAT      = lineMat(BLUE);
const DISK_EDGE_MAT = lineMat(DISK_EDGE);

/* 带描边的 Mesh: EdgesGeometry 作为子对象, renderOrder=10 (填充之后绘制) */
function createEdgedMesh(geometry, fill, threshold = 1, edgeMat = EDGE_MAT) {
  const mesh = new THREE.Mesh(geometry, fill);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geometry, threshold), edgeMat);
  edges.renderOrder = 10;
  mesh.add(edges);
  return mesh;
}
function createEdgedBox(w, h, d, x, y, z, fill) {
  const mesh = createEdgedMesh(new THREE.BoxGeometry(w, h, d), fill);
  mesh.position.set(x, y, z);
  return mesh;
}
/* 圆柱: 阈值 15° 抑制侧面竖缝, 只保留上下圆环 */
function createEdgedCylinder(rt, rb, h, x, y, z, fill, seg = 32) {
  const mesh = createEdgedMesh(new THREE.CylinderGeometry(rt, rb, h, seg), fill, 15);
  mesh.position.set(x, y, z);
  return mesh;
}

/* 带切角的矩形外轮廓 (60x60, 四角倒角 3) + holes */
function chamferRectShape(holes = []) {
  const s = new THREE.Shape();
  s.moveTo(-27, -30); s.lineTo(27, -30); s.lineTo(30, -27); s.lineTo(30, 27);
  s.lineTo(27, 30);  s.lineTo(-27, 30); s.lineTo(-30, 27); s.lineTo(-30, -27);
  s.closePath();
  for (const h of holes) {
    const p = new THREE.Path();
    if (h.type === 'rect') {
      p.moveTo(h.x0, h.z0); p.lineTo(h.x1, h.z0); p.lineTo(h.x1, h.z1); p.lineTo(h.x0, h.z1);
      p.closePath();
    } else if (h.type === 'circle') {
      p.absarc(h.x, h.z, h.r, 0, Math.PI * 2, true);
    }
    s.holes.push(p);
  }
  return s;
}
/* 挤压壳体: 形状平面转到 XZ, 厚度沿 Y 且垂直居中 */
function extrudeShell(shape, depth) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  g.rotateX(-Math.PI / 2);
  g.translate(0, -depth / 2, 0);
  return g;
}

/* ================= 3.1 TOP SHELL (上壳) ================= */
function createTopShell() {
  const group = new THREE.Group();
  const fill = ghostFill();

  /* 基础: 切角矩形 60x60x2 (局部 Y∈[-1,1])
     (a) HD NOTCH: 左上角 4x4 真镂空 (Shape holes)
     (d) Shutter 开口槽: 前缘磁头通道贯穿孔 (与下壳/快门共用 HEAD_CHANNEL) */
  const shape = chamferRectShape([
    { type: 'rect', x0: -28, z0: -28, x1: -24, z1: -24 },
    { type: 'rect', x0: HEAD_CHANNEL.x, z0: HEAD_CHANNEL.z,
      x1: HEAD_CHANNEL.x + HEAD_CHANNEL.w, z1: HEAD_CHANNEL.z + HEAD_CHANNEL.h },
  ]);
  group.add(createEdgedMesh(extrudeShell(shape, 2), fill));

  /* (b) 标签凹槽: 上半部分中央 36x22 薄盒, 略低于上表面 (局部上表面 y=1) */
  group.add(createEdgedBox(36, 0.4, 22, 0, 0.6, -15, fill));
  /* (c) 内部凹槽: 标签凹槽下方 20x10 (金属滑盖滑动凹陷区) */
  group.add(createEdgedBox(20, 0.4, 10, 0, 0.6, 2, fill));

  /* (e) 箭头标记: Shutter 开口附近的小三角箭头, 指向磁头通道 (+Z) */
  const arrowMat = lineMat(BLUE);
  const tri = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    v3(-9.5, 1.03, 13.8), v3(-7, 1.03, 12), v3(-4.5, 1.03, 13.8), v3(-9.5, 1.03, 13.8),
  ]), arrowMat);
  const tail = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    v3(-7, 1.03, 12), v3(-7, 1.03, 10.5),
  ]), arrowMat);
  tri.renderOrder = 10; tail.renderOrder = 10;
  group.add(tri, tail);

  return { group, fillMats: [fill] };
}

/* ================= 3.2 / 3.5 DUST LINER (防尘布, C 字形圆环) ================= */
function createDustLiner() {
  const group = new THREE.Group();
  const fill = ghostFill();

  /* C 字形: 外圆 r=24, 内圆 r=20, 前缘切出矩形缺口 (与磁头通道对位, X∈[-10,-4])
     单条外轮廓路径: 外弧(长程) + 缺口两侧 + 内弧(长程) */
  const OUTER = 24, INNER = 20;
  const OL = v2(-10, Math.sqrt(OUTER * OUTER - 100));   // 外圆 x=-10: z=21.82
  const IL = v2(-10, Math.sqrt(INNER * INNER - 100));   // 内圆 x=-10: z=17.32
  const IR = v2(-4,  Math.sqrt(INNER * INNER - 16));    // 内圆 x=-4 : z=19.60
  const OR = v2(-4,  Math.sqrt(OUTER * OUTER - 16));    // 外圆 x=-4 : z=23.66
  const s = new THREE.Shape();
  s.moveTo(OL.x, OL.y);
  s.lineTo(IL.x, IL.y);
  s.absarc(0, 0, INNER, Math.atan2(IL.y, IL.x), Math.atan2(IR.y, IR.x), false); // 内弧长程(经背面)
  s.lineTo(OR.x, OR.y);
  s.absarc(0, 0, OUTER, Math.atan2(OR.y, OR.x), Math.atan2(OL.y, OL.x), true);  // 外弧长程(经背面)
  s.closePath();

  const geo = extrudeShell(s, 0.3); // 极薄挤压
  group.add(createEdgedMesh(geo, fill));

  return { group, fillMats: [fill] };
}

/* ================= 3.3 MAGNETIC DISK (磁片, 唯一实体填充部件) ================= */
function createMagneticDisk() {
  const group = new THREE.Group();
  const mat = ghostFill(DISK_BLUE); // 爆炸态目标 opacity 0.5

  const geo = new THREE.CylinderGeometry(22, 22, 0.3, 64);
  group.add(createEdgedMesh(geo, mat, 15, DISK_EDGE_MAT)); // 深蓝描边

  /* 表面数据轨道反光: 三条短斜线 (弧线近似) */
  const trackMat = lineMat(TRACK_BLUE);
  const arcs = [[14, 3.4, 4.0], [17, 3.7, 4.3], [20, 4.0, 4.6]];
  for (const [r, a0, a1] of arcs) {
    const pts = [];
    for (let i = 0; i <= 8; i++) {
      const a = lerp(a0, a1, i / 8);
      pts.push(v3(r * Math.cos(a), 0.16, r * Math.sin(a))); // 略高于上表面
    }
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), trackMat);
    line.renderOrder = 10;
    group.add(line);
  }
  return { group, fillMats: [mat] };
}

/* ================= 3.4 HUB (中心金属盘) ================= */
function createHub() {
  const group = new THREE.Group();
  const mat = ghostFill(DISK_BLUE);

  /* 圆盘 r=5 厚 0.4, 中央圆形孔 + 旁边方形孔 (驱动主轴卡口) */
  const shape = new THREE.Shape();
  shape.absarc(0, 0, 5, 0, Math.PI * 2, false);
  const holeC = new THREE.Path();
  holeC.absarc(0, 0, 1, 0, Math.PI * 2, true);
  shape.holes.push(holeC);
  const holeS = new THREE.Path();
  holeS.moveTo(1.2, -0.8); holeS.lineTo(2.8, -0.8); holeS.lineTo(2.8, 0.8); holeS.lineTo(1.2, 0.8);
  holeS.closePath();
  shape.holes.push(holeS);

  const geo = extrudeShell(shape, 0.4);
  group.add(createEdgedMesh(geo, mat, 15, DISK_EDGE_MAT));
  return { group, fillMats: [mat] };
}

/* ================= 3.6 BOTTOM SHELL (下壳) ================= */
function createBottomShell() {
  const group = new THREE.Group();
  const fill = ghostFill();

  /* 基础: 切角矩形 + 孔洞
     (b) 中央圆孔 r=7 (主轴孔)
     (g) 磁头通道贯穿孔 (与上壳/快门共用 HEAD_CHANNEL)
     (f) WRITE PROTECT NOTCH: 右后角 3x3 方形镂空 */
  const shape = chamferRectShape([
    { type: 'circle', x: 0, z: 0, r: 7 },
    { type: 'rect', x0: HEAD_CHANNEL.x, z0: HEAD_CHANNEL.z,
      x1: HEAD_CHANNEL.x + HEAD_CHANNEL.w, z1: HEAD_CHANNEL.z + HEAD_CHANNEL.h },
    { type: 'rect', x0: 25, z0: -28, x1: 28, z1: -25 },
  ]);
  group.add(createEdgedMesh(extrudeShell(shape, 2), fill));

  /* (a) 中央大圆形凹陷: 直径 44 薄圆柱叠加在上表面 (磁片容纳区) */
  group.add(createEdgedCylinder(22, 22, 0.3, 0, 0.75, 0, fill, 48));
  /* (c) 四角定位柱 */
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    group.add(createEdgedCylinder(1.5, 1.5, 1, 22 * sx, 1.5, 22 * sz, fill, 24));
  }
  /* (d) LIFTER: 中下方小矩形凸起 8x4x1 */
  group.add(createEdgedBox(8, 1, 4, 0, 1.5, 8, fill));
  /* (e) SHUTTER SPRING 区: 前边缘中部小矩形凹槽 (前立面内嵌) */
  group.add(createEdgedBox(10, 4, 0.3, 0, 0, 29.6, fill));

  return { group, fillMats: [fill] };
}

/* ================= 3.7 SHUTTER (金属滑盖, 不透明, 唯一开孔部件) ================= */
function createShutter() {
  const group = new THREE.Group();
  /* 不透明金属材质 — 禁止半透明 (自检 #1) */
  const metal = new THREE.MeshBasicMaterial({ color: SHUTTER_GRAY });

  /* 板面 22(X) x 16(Z) x 1(Y), 局部 Y∈[0,1] (组原点在板面下表面)
     矩形真镂空窗口: 偏左 X∈[-10,-4] (自检 #2)
     - 窗口短边(6, 沿X) ∥ 快门长边(22, 沿X)
     - 窗口长边(14, 沿Z) ∥ 快门短边(16, 沿Z)  => 开孔长轴 ⟂ 快门长轴
     局部坐标由 HEAD_CHANNEL 推导, 与上下壳三处一致 (自检 #3) */
  const winX0 = HEAD_CHANNEL.x;
  const winX1 = HEAD_CHANNEL.x + HEAD_CHANNEL.w;            // -10 .. -4
  const winZ0 = HEAD_CHANNEL.z - 22;                        // 组中心 z=22 -> 窗口世界 [15,29]
  const winZ1 = HEAD_CHANNEL.z + HEAD_CHANNEL.h - 22;       // -7 .. 7

  const plateShape = new THREE.Shape();
  plateShape.moveTo(-11, -8); plateShape.lineTo(11, -8); plateShape.lineTo(11, 8); plateShape.lineTo(-11, 8);
  plateShape.closePath();
  const win = new THREE.Path();
  win.moveTo(winX0, winZ0); win.lineTo(winX1, winZ0); win.lineTo(winX1, winZ1); win.lineTo(winX0, winZ1);
  win.closePath();
  plateShape.holes.push(win);

  const plateGeo = new THREE.ExtrudeGeometry(plateShape, { depth: 1, bevelEnabled: false });
  plateGeo.rotateX(-Math.PI / 2); // 局部 Y∈[0,1]
  group.add(createEdgedMesh(plateGeo, metal));

  /* U 形包边: 前立面竖条 + 底部折边 (随组整体移动, 同材质) */
  group.add(createEdgedBox(22, 1, 1, 0, -0.5, 8, metal));   // 前缘立条 (世界 z=30 处)
  group.add(createEdgedBox(22, 1, 7, 0, -1.5, 4, metal));   // 底部折边

  return { group, fillMats: [] }; // 无透明度动画
}

/* ================= WRITE PROTECT TAB (防写滑块) ================= */
function createWriteProtectTab() {
  const group = new THREE.Group();
  const fill = ghostFill(); // 爆炸态目标 0.5
  group.add(createEdgedBox(3, 2, 3, 0, 0, 0, fill));
  return { group, fillMats: [fill] };
}

/* ================= 场景搭建 ================= */
const container = document.getElementById('scene-container');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0); // 透明背景, 露出点阵网格
renderer.domElement.style.zIndex = '1';
container.appendChild(renderer.domElement);

const labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.zIndex = '2';
container.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();

/* 正交相机: 等距视角 */
const FRUSTUM = 90;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 2000);
camera.position.set(100, 80, 100);
camera.lookAt(0, 0, 0);

/* ================= 点阵网格背景 ================= */
(function initDotGrid() {
  const canvas = document.getElementById('dotgrid');
  const ctx = canvas.getContext('2d');
  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#F5F7FA';
    ctx.fillRect(0, 0, w, h);
    const spacing = 26, r = 1.1;
    ctx.fillStyle = '#c7d4ec';
    for (let x = spacing / 2; x < w; x += spacing) {
      for (let y = spacing / 2; y < h; y += spacing) {
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  draw();
  window.addEventListener('resize', draw);
})();

/* ================= 交互: OrbitControls (必须) ================= */
let controls;
function setupControls() {
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  /* 与 DCC 习惯一致: 左键旋转 / 中键+滚轮缩放 / 右键平移 */
  controls.mouseButtons.LEFT   = THREE.MOUSE.ROTATE;
  controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
  controls.mouseButtons.RIGHT  = THREE.MOUSE.PAN;
  controls.enableRotate = true;
  controls.enableZoom   = true;   // 滚轮缩放必须可用
  controls.enablePan    = true;
  /* 正交相机: 用 minZoom/maxZoom 限制缩放 */
  controls.minZoom = 0.5;
  controls.maxZoom = 2.5;
  controls.zoom = 1.0;
  controls.target.set(0, 0, 0);
  controls.update();
  /* 平移范围钳制: 限制 target 移动半径, 避免软盘拖出画面过多 */
  controls.addEventListener('change', () => {
    if (controls.target.length() > 70) controls.target.setLength(70);
  });
  /* 阻止右键菜单遮挡平移 */
  renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
}

/* ================= 标注与引线 ================= */
const LABEL_DEFS = [
  { text: 'HD NOTCH',            pos: [-42, 47.5, -33], target: [-28, 46.3, -28] },
  { text: 'TOP SHELL',           pos: [26, 48.5, 22],   target: [10, 46.3, 10] },
  { text: 'DUST LINER (UPPER)',  pos: [-26, 31.5, -16], target: [-10, 30.2, -20] },
  { text: 'HUB',                 pos: [-16, 19.5, 12],  target: [-3, 18.3, 3] },
  { text: 'MAGNETIC DISK',       pos: [24, 16.5, -20],  target: [12, 15.2, -8] },
  { text: 'DUST LINER (LOWER)',  pos: [-24, 1.5, -14],  target: [-10, 0.2, -20] },
  { text: 'BOTTOM SHELL',        pos: [24, -17.5, 20],  target: [10, -14.2, 10] },
  { text: 'LIFTER',              pos: [18, -12.5, 16],  target: [4, -13.2, 9] },
  { text: 'SHUTTER SPRING',      pos: [18, -12, 30],    target: [2, -14.8, 29.5] },
  { text: 'WRITE PROTECT NOTCH', pos: [38, -12.5, -22], target: [26.5, -14.2, -26.5] },
  { text: 'SHUTTER',             pos: [-46, -14, 38],   target: [-31, -14.8, 33] },
  { text: 'WRITE PROTECT TAB',   pos: [44, -13.5, -38], target: [33, -14.8, -33] },
];
let labels = [];

function setupLabels() {
  labels = LABEL_DEFS.map((def) => {
    const div = document.createElement('div');
    div.className = 'label';
    div.textContent = def.text;
    div.style.opacity = 0; // 初始隐藏, CSS transition 淡入
    const obj = new THREE.CSS2DObject(div);
    obj.position.set(def.pos[0], def.pos[1], def.pos[2]);
    scene.add(obj);

    /* 每条标注配一条短引线 */
    const leaderMat = lineMat(BLUE, 0);
    const leaderGeo = new THREE.BufferGeometry().setFromPoints([
      v3(def.pos[0], def.pos[1], def.pos[2]),
      v3(def.target[0], def.target[1], def.target[2]),
    ]);
    const leader = new THREE.Line(leaderGeo, leaderMat);
    leader.renderOrder = 11;
    scene.add(leader);

    return { div, leaderMat, anchorY: def.pos[1] };
  });
  /* 淡入顺序: 从上到下 */
  labels.sort((a, b) => b.anchorY - a.anchorY);
}

/* ================= 连接虚线 (LineDashedMaterial) ================= */
const dashedMat = new THREE.LineDashedMaterial({
  color: BLUE, dashSize: 3, gapSize: 2.5,
  transparent: true, opacity: 0, depthWrite: false,
});
const dashedLines = [];

function makeDashed(a, b) {
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), dashedMat);
  line.computeLineDistances(); // LineDashedMaterial 必须
  line.renderOrder = 11;
  line.visible = false;
  scene.add(line);
  dashedLines.push(line);
}
function setupDashedLines() {
  /* 4 条垂直虚线: 贯穿四个切角, Top Shell -> Bottom Shell (爆炸态跨度) */
  for (const [sx, sz] of [[27, 27], [27, -27], [-27, 27], [-27, -27]]) {
    makeDashed(v3(sx, -16.5, sz), v3(sx, 46.5, sz));
  }
  /* 斜向虚线: Shutter / WRITE PROTECT TAB 连到下壳对应位置 */
  makeDashed(v3(-7, -14.5, 29.5), v3(-31, -15, 31));
  makeDashed(v3(26.5, -14.5, -26.5), v3(33, -15, -33));
}

/* ================= 可动部件 (双状态位置 + 透明度目标) ================= */
let parts = [];
function setupParts() {
  const top     = createTopShell();
  const linerU  = createDustLiner();
  const disk    = createMagneticDisk();
  const hub     = createHub();
  const linerL  = createDustLiner();
  const bottom  = createBottomShell();
  const shutter = createShutter();
  const tab     = createWriteProtectTab();

  scene.add(top.group, linerU.group, disk.group, hub.group,
            linerL.group, bottom.group, shutter.group, tab.group);

  parts = [
    /* 名称           assembled -> exploded                     delay  mats 目标opacity */
    { name: 'TOP SHELL',        group: top.group,     from: v3(0, 1.5, 0),    to: v3(0, 45, 0),    delay: 0 * STAGGER_MS, mats: top.fillMats,    target: 0.08 },
    { name: 'DUST LINER (上)',  group: linerU.group,  from: v3(0, 1.0, 0),    to: v3(0, 30, 0),    delay: 1 * STAGGER_MS, mats: linerU.fillMats, target: 0.08 },
    { name: 'MAGNETIC DISK',    group: disk.group,    from: v3(0, 0.5, 0),    to: v3(0, 15, 0),    delay: 2 * STAGGER_MS, mats: disk.fillMats,   target: 0.5 },
    { name: 'HUB',              group: hub.group,     from: v3(0, 0.7, 0),    to: v3(0, 18, 0),    delay: 3 * STAGGER_MS, mats: hub.fillMats,    target: 0.5 },
    { name: 'DUST LINER (下)',  group: linerL.group,  from: v3(0, 0.0, 0),    to: v3(0, 0, 0),     delay: 4 * STAGGER_MS, mats: linerL.fillMats, target: 0.08 },
    { name: 'BOTTOM SHELL',     group: bottom.group,  from: v3(0, -1.5, 0),   to: v3(0, -15, 0),   delay: 5 * STAGGER_MS, mats: bottom.fillMats, target: 0.08 },
    /* SHUTTER: 组装态嵌入下壳前缘 (0,-1.5,22); 爆炸态飞至左前方; 不参与透明度动画 */
    { name: 'SHUTTER',          group: shutter.group, from: v3(0, -1.5, 22),  to: v3(-32, -15, 32), delay: 6 * STAGGER_MS, mats: [], target: 1 },
    { name: 'WRITE PROTECT TAB',group: tab.group,     from: v3(26.5, -1, -26.5), to: v3(34, -15, -34), delay: 7 * STAGGER_MS, mats: tab.fillMats, target: 0.5 },
  ];
  for (const p of parts) {
    p.dur = EXPLODE_DURATION - p.delay; // 所有部件同一时刻到达终点 (~3s)
    for (const m of p.mats) { m.assembled = 1; m.exploded = p.target; }
    p.group.position.copy(p.from); // 初始渲染 = 组装态 (assembledY)
  }
}

/* ================= 动画状态机 ================= */
/* === ANIMATION: state machine === */
let animState = 'assembled'; // assembled | exploding | exploded | collapsing
let animElapsed = 0;
const tweens = [];

/* 通用补间 (标注/虚线淡入淡出) */
function addTween(obj, key, from, to, dur, delay = 0) {
  tweens.push({ obj, key, from, to, dur, delay, elapsed: 0 });
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.elapsed += dt * 1000;
    const t = clamp((tw.elapsed - tw.delay) / tw.dur, 0, 1);
    tw.obj[tw.key] = lerp(tw.from, tw.to, easeInOutCubic(t));
    if (t >= 1) tweens.splice(i, 1);
  }
}

/* === ANIMATION: explode trigger === */
function triggerExplode() {
  if (animState !== 'assembled') return; // 动画进行中忽略
  animState = 'exploding';
  animElapsed = 0;
  showHint(false);
}
/* === ANIMATION: collapse trigger === */
function triggerCollapse() {
  if (animState !== 'exploded') return;
  hideLabels();                  // 标注/虚线先淡出
  animState = 'collapsing';
  animElapsed = -350;            // 等 ~0.35s 淡出完成再开始收回
}

/* 爆炸完成: 先虚线, 再标签逐条淡入 */
function onExploded() {
  setTimeout(() => {             // +200ms: 虚线
    for (const l of dashedLines) { l.visible = true; addTween(l.material, 'opacity', 0, 1, 600, 0); }
  }, 200);
  setTimeout(showLabels, 400);   // 再 +200ms: 标签 (60ms 错峰, 从上到下)
}
function showLabels() {
  labels.forEach((lbl, i) => {
    setTimeout(() => {
      lbl.div.style.opacity = 1;                     // CSS 过渡自动淡入
      addTween(lbl.leaderMat, 'opacity', 0, 1, 400, 0); // 引线同步
    }, i * 60);
  });
}
function hideLabels() {
  for (const lbl of labels) { lbl.div.style.opacity = 0; lbl.leaderMat.opacity = 0; }
  for (const l of dashedLines) l.material.opacity = 0;
}
function showHint(on) {
  document.getElementById('hint').style.opacity = on ? 1 : 0;
}

/* === ANIMATION: 主推进 (位置 + 透明度同步 lerp) === */
function updateAnimation(dt) {
  updateTweens(dt);
  if (animState !== 'exploding' && animState !== 'collapsing') return;

  const exploding = animState === 'exploding';
  animElapsed += dt * 1000;

  let allDone = true, maxP = 0;
  for (const part of parts) {
    const t = clamp((animElapsed - part.delay) / part.dur, 0, 1);
    const e = easeInOutCubic(t);
    maxP = Math.max(maxP, e);
    if (t < 1) allDone = false;

    /* 位移插值 (Y, 必要时 X/Z) */
    if (exploding) part.group.position.lerpVectors(part.from, part.to, e);
    else part.group.position.lerpVectors(part.to, part.from, e);

    /* 透明度与位移使用同一 progress: 合体端 1 -> 展开端目标值 */
    const op = exploding ? e : 1 - e;
    for (const m of part.mats) m.opacity = lerp(m.assembled, m.exploded, op);
  }

  /* 相机轻微跟随: 目标从 (0,0,0) 漂移到 (0,15,0), 收回时返回 */
  controls.target.y = 15 * (exploding ? maxP : 1 - maxP);
  controls.update();

  if (allDone) {
    if (exploding) { animState = 'exploded'; onExploded(); }
    else           { animState = 'assembled'; showHint(true); }
  }
}

/* === ANIMATION: 空格触发 === */
document.addEventListener('keydown', (e) => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  if (animState === 'assembled') triggerExplode();
  else if (animState === 'exploded') triggerCollapse();
  /* exploding / collapsing 期间忽略 */
});

/* ================= 窗口尺寸 ================= */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w / h;
  camera.left = -FRUSTUM * aspect / 2;
  camera.right = FRUSTUM * aspect / 2;
  camera.top = FRUSTUM / 2;
  camera.bottom = -FRUSTUM / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
onResize();

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  updateAnimation(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

setupParts();
setupLabels();
setupDashedLines();
setupControls();
animate();

/* ============================================================================
 * ── 快门与开孔自检 (逐条确认) ─────────────────────────────────────────────
 *  1. SHUTTER 本体为不透明金属感:
 *     MeshBasicMaterial({ color: 0x4a5568 }) — transparent=false, 非半透明幽灵面;
 *     createShutter() 中 fillMats 为空数组, 不参与任何透明度 lerp;
 *     爆炸态仍保持不透明, 仅随 Group 位移到 (-32,-15,32)。
 *  2. SHUTTER 矩形真镂空, 偏左, 开孔短边与快门长边平行:
 *     板面 22(X)x16(Z), 窗口 X∈[-10,-4] (组中心 x=0, 明显偏左);
 *     窗口短边 6 沿 X (∥ 快门长边 22), 窗口长边 14 沿 Z (∥ 快门短边 16),
 *     即开孔长轴 ⟂ 快门长轴; 由 Shape + holes + ExtrudeGeometry 实现真镂空。
 *  3. 三处开孔同一套尺寸与局部坐标, 组装态对齐:
 *     HEAD_CHANNEL = { x:-10, w:6, z:15, h:14 } 被 3.1(d)、3.6(g)、3.7 共用;
 *     上壳/下壳孔洞: X∈[-10,-4], Z∈[15,29]; 快门组组装于 (0,-1.5,22),
 *     窗口局部 Z∈[-7,7] -> 世界 Z∈[15,29], 三处 XZ 足迹完全重合 (同一磁头通道)。
 * ========================================================================== */
</script>
