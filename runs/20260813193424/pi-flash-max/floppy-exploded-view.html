<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3.5" FLOPPY DISK — EXPLODED BLUEPRINT</title>
<style>
  /* ============================================================
     蓝图 UI 风格：等宽字体 + 工程蓝 + 浅灰白点阵背景
     ============================================================ */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #F5F7FA;
    font-family: 'Courier New', Courier, monospace;
    user-select: none;
    -webkit-user-select: none;
  }
  /* 点阵网格背景画布（Canvas 绘制，置于最底层） */
  #dotgrid { position: fixed; inset: 0; z-index: 0; display: block; }

  /* 侧边垂直排版标题 */
  .fig-text {
    position: fixed; top: 50%;
    transform: translateY(-50%);
    font-size: 13px; letter-spacing: 6px;
    color: #4169E1; opacity: 0.55;
    writing-mode: vertical-rl; text-orientation: mixed;
    pointer-events: none; z-index: 3;
  }
  #figLeft  { left: 18px;  }
  #figRight { right: 18px; }

  /* 底部提示 */
  #hintWrap {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 3; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #hint {
    font-size: 14px; letter-spacing: 4px; color: #4169E1;
    animation: breathe 2.6s ease-in-out infinite;
    white-space: nowrap;
  }
  #controlsHint {
    margin-top: 8px;
    font-size: 11px; letter-spacing: 2px; color: #4169E1; opacity: 0.45;
    white-space: nowrap;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.60; }
    50%      { opacity: 0.22; }
  }

  /* CSS2D 标注 */
  .c2d { position: absolute; top: 0; left: 0; pointer-events: none; }
  .c2d span {
    display: block;
    transform: translate(-50%, -50%);
    font-family: 'Courier New', Courier, monospace;
    font-size: 12px; letter-spacing: 1.5px;
    color: #4169E1; white-space: nowrap;
    opacity: 0; /* 初始隐藏，JS 控制淡入 */
    transition: opacity 0.4s ease;
    background: rgba(245, 247, 250, 0.65);
    padding: 1px 6px;
  }
</style>
</head>
<body>

  <!-- 点阵网格背景 -->
  <canvas id="dotgrid"></canvas>

  <!-- 侧边标题 -->
  <div id="figLeft" class="fig-text">FIG_001</div>
  <div id="figRight" class="fig-text">[ 3.5" FLOPPY DISK ]</div>

  <!-- 底部操作提示 -->
  <div id="hintWrap">
    <div id="hint">PRESS [ SPACE ] TO EXPLODE</div>
    <div id="controlsHint">LMB: ORBIT · WHEEL: ZOOM · RMB: PAN</div>
  </div>

  <!-- ============ Three.js (CDN, ES Module + importmap) ============ -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

  // ===================================================================
  // 0. 全局常量（工程蓝配色 / 共享尺寸）
  // ===================================================================
  const BLUE        = 0x4169E1;   // 工程蓝（所有线框、标注）
  const GHOST_COLOR = 0xe9eefc;   // 半透明部件填充色（蓝白色）
  const DISK_COLOR  = 0x7b9df8;   // 磁片实体填充
  const DISK_EDGE   = 0x2b4a8f;   // 磁片深蓝描边
  const SHUTTER_COL = 0x4a5568;   // 快门不透明金属板（深蓝灰）

  const SHELL_SIZE  = 60;         // 壳体 X/Z 尺寸
  const CHAMFER     = 3;          // 四角切角
  const SHELL_DEPTH = 2;          // 壳体厚度

  // —— 磁头通道矩形（3.1d / 3.6g / 3.7 三处共用同一套尺寸与局部坐标）——
  const SLOT_W = 6;               // 沿 X（快门滑动方向）的宽度 —— 开孔“短边”
  const SLOT_D = 14;              // 沿 Z（前缘方向）的长度 —— 开孔“长边”
  const SLOT_X = -22;             // 通道中心 X（偏左，与参考图一致）
  const SLOT_Z = -22;             // 通道中心 Z（前边缘内侧）

  const EDGE_MAT = new THREE.LineBasicMaterial({ color: BLUE });

  const DEG = Math.PI / 180;
  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const lerp    = (a, b, t) => a + (b - a) * t;
  // 手写 easeInOutCubic（不依赖外部库）
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  // ===================================================================
  // 1. 点阵网格背景（Canvas 2D）
  // ===================================================================
  const dotCanvas = document.getElementById('dotgrid');
  const dotCtx = dotCanvas.getContext('2d');
  function drawDotGrid() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    dotCanvas.width = w * dpr; dotCanvas.height = h * dpr;
    dotCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dotCtx.clearRect(0, 0, w, h);
    const spacing = 26;
    dotCtx.fillStyle = 'rgba(65, 105, 225, 0.14)';
    for (let x = spacing / 2; x < w; x += spacing) {
      for (let y = spacing / 2; y < h; y += spacing) {
        dotCtx.beginPath();
        dotCtx.arc(x, y, 1.15, 0, Math.PI * 2);
        dotCtx.fill();
      }
    }
  }
  drawDotGrid();

  // ===================================================================
  // 2. 场景 / 正交相机 / 渲染器
  // ===================================================================
  const scene = new THREE.Scene();

  // —— 正交相机：等距视角 ——
  const FRUSTUM_H = 150; // zoom=1 时可见的纵向世界单位
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 2000);
  camera.position.set(100, 80, 100);
  camera.lookAt(0, 0, 0);
  camera.zoom = 1.15;
  function updateFrustum() {
    const a = window.innerWidth / window.innerHeight;
    camera.left   = (-FRUSTUM_H * a) / 2;
    camera.right  = ( FRUSTUM_H * a) / 2;
    camera.top    =  FRUSTUM_H / 2;
    camera.bottom = -FRUSTUM_H / 2;
    camera.updateProjectionMatrix();
  }
  updateFrustum();

  // —— WebGL 渲染器（透明背景，露出点阵）——
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.domElement.style.position = 'absolute';
  renderer.domElement.style.top = '0';
  renderer.domElement.style.left = '0';
  renderer.domElement.style.zIndex = '1';
  document.body.appendChild(renderer.domElement);

  // —— CSS2D 渲染器（标注层）——
  const labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.left = '0';
  labelRenderer.domElement.style.zIndex = '2';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.body.appendChild(labelRenderer.domElement);

  // ===================================================================
  // 3. 几何辅助函数
  // ===================================================================
  // 半透明“幽灵”填充材质（组装态 opacity=1 → 爆炸态 0.08，由动画 lerp）
  function ghostMat() {
    return new THREE.MeshBasicMaterial({ color: GHOST_COLOR, transparent: true, opacity: 1 });
  }
  // 生成 EdgesGeometry 线框并作为 mesh 的子节点（随 mesh 变换）
  function addEdges(mesh, color = BLUE) {
    const seg = new THREE.LineSegments(
      new THREE.EdgesGeometry(mesh.geometry, 1),
      new THREE.LineBasicMaterial({ color })
    );
    mesh.add(seg);
    return seg;
  }
  // 生成 Box 网格（含描边），返回 mesh
  function addBox(group, w, h, d, x, y, z) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), ghostMat());
    mesh.position.set(x, y, z);
    addEdges(mesh);
    group.add(mesh);
    return mesh;
  }
  // 带切角的外轮廓（CCW）：60×60，四角切角 3
  function chamferRectShape(size = SHELL_SIZE, chamfer = CHAMFER) {
    const s = new THREE.Shape();
    const h = size / 2, c = chamfer;
    s.moveTo(-h + c, -h);
    s.lineTo( h - c, -h);
    s.lineTo( h, -h + c);
    s.lineTo( h,  h - c);
    s.lineTo( h - c,  h);
    s.lineTo(-h + c,  h);
    s.lineTo(-h,  h - c);
    s.lineTo(-h, -h + c);
    s.closePath();
    return s;
  }
  // 矩形镂空路径（CW 绕向）
  function rectHole(x0, y0, x1, y1) {
    const p = new THREE.Path();
    p.moveTo(x0, y1); p.lineTo(x1, y1); p.lineTo(x1, y0); p.lineTo(x0, y0);
    p.closePath();
    return p;
  }
  // 圆形路径：cw=true 表示 CW（用作孔洞）
  function circlePath(cx, cy, r, segs = 32, cw = false) {
    const p = new THREE.Path();
    for (let i = 0; i <= segs; i++) {
      const a = (i / segs) * Math.PI * 2 * (cw ? -1 : 1);
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      if (i === 0) p.moveTo(x, y); else p.lineTo(x, y);
    }
    return p;
  }
  // 圆形外轮廓（返回真正的 Shape，可挂 holes）
  function circleShape(cx, cy, r, segs = 40) {
    const s = new THREE.Shape();
    for (let i = 0; i < segs; i++) {
      const a = (i / segs) * Math.PI * 2;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      if (i === 0) s.moveTo(x, y); else s.lineTo(x, y);
    }
    s.closePath();
    return s;
  }
  // 在 XY 平面挤压形状，再旋转到 XZ 平面（shape 的 +y → 世界 +z 即“后”），
  // 挤压深度沿世界 Y，居中于原点
  function extrudeToXZ(shape, depth) {
    const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 24 });
    g.rotateX(Math.PI / 2);
    g.translate(0, depth / 2, 0);
    return g;
  }

  // ===================================================================
  // 4. TOP SHELL（上壳）—— 复合结构
  //    外轮廓带切角 + 真镂空孔（HD NOTCH / 快门开口槽）+ 下沉凹槽 + 箭头
  // ===================================================================
  function createTopShell() {
    const group = new THREE.Group();
    const topShellMats = [];

    const shape = chamferRectShape();
    // (a) HD NOTCH：左上角 4×4 方形真镂空
    shape.holes.push(rectHole(-28, 24, -24, 28));
    // (d) Shutter 开口槽：前边缘长方形贯穿镂空（与 3.6g / 3.7 共用 SLOT_* 参数）
    shape.holes.push(rectHole(SLOT_X - SLOT_W / 2, SLOT_Z - SLOT_D / 2,
                              SLOT_X + SLOT_W / 2, SLOT_Z + SLOT_D / 2));

    const geo = extrudeToXZ(shape, SHELL_DEPTH);
    const shell = new THREE.Mesh(geo, ghostMat());
    topShellMats.push({ mat: shell.material, from: 1, to: 0.08 });
    addEdges(shell);
    group.add(shell);

    // (b) 标签凹槽：上半部中央 36×22 下沉浅凹槽（薄盒略低于表面，仅描边可见）
    topShellMats.push({ mat: addBox(group, 36, 0.3, 22, 0, 0.8, 19).material, from: 1, to: 0.08 });
    // (c) 内部凹槽：标签凹槽下方 20×10 滑盖凹陷区
    topShellMats.push({ mat: addBox(group, 20, 0.3, 10, 0, 0.8, 2).material, from: 1, to: 0.08 });

    // (e) 箭头标记：Shutter 开口右侧的小三角（指示滑开方向 +X）
    const arrowPts = [
      new THREE.Vector3(-16.5, 1.02, -21),
      new THREE.Vector3(-12.5, 1.02, -22),
      new THREE.Vector3(-16.5, 1.02, -23),
    ];
    const arrow = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(arrowPts), EDGE_MAT);
    group.add(arrow);

    group.userData.mats = topShellMats;
    return group;
  }

  // ===================================================================
  // 5. DUST LINER（防尘布，上/下同形）—— C 字形圆环
  //    外圆在“前左”处切开一个矩形缺口模拟磁头窗口，中央留圆孔
  // ===================================================================
  function createLinerShape(R = 27, r = 6) {
    const s = new THREE.Shape();
    // 外圆缺口两端点（θ=205° 与 θ=230°，位于前-左区域）
    const A = [R * Math.cos(205 * DEG), R * Math.sin(205 * DEG)]; // (-24.47, -11.41)
    const B = [R * Math.cos(230 * DEG), R * Math.sin(230 * DEG)]; // (-17.36, -20.68)
    // C 字缺口：从 A 折入矩形缺口，再回到 B
    s.moveTo(A[0], A[1]);
    s.lineTo(A[0], -9);   // 缺口“顶边”（朝盘心）
    s.lineTo(B[0], -9);
    s.lineTo(B[0], B[1]);
    // 其余外圆（长弧）：230° → 565°(=205°)，闭合于 A
    for (let d = 235; d <= 565; d += 5) {
      s.lineTo(R * Math.cos(d * DEG), R * Math.sin(d * DEG));
    }
    s.closePath();
    // 中央圆孔
    s.holes.push(circlePath(0, 0, r, 32, true));
    return s;
  }
  function createLiner() {
    const group = new THREE.Group();
    const geo = extrudeToXZ(createLinerShape(), 0.05);
    const mesh = new THREE.Mesh(geo, ghostMat());
    const mats = [{ mat: mesh.material, from: 1, to: 0.08 }];
    addEdges(mesh);
    group.add(mesh);
    group.userData.mats = mats;
    return group;
  }

  // ===================================================================
  // 6. MAGNETIC DISK（磁片）—— 唯一实体填充部件（半透明蓝，爆炸态 0.5）
  // ===================================================================
  function createDisk() {
    const group = new THREE.Group();
    const diskMat = new THREE.MeshBasicMaterial({
      color: DISK_COLOR, transparent: true, opacity: 1
    });
    const geo = new THREE.CylinderGeometry(22, 22, 0.3, 64);
    const mesh = new THREE.Mesh(geo, diskMat);
    addEdges(mesh, DISK_EDGE);
    group.add(mesh);

    // 表面数据轨道反光：三条短斜线
    const trackPts = [
      new THREE.Vector3(-6, 0.17, 10), new THREE.Vector3(8, 0.17, 14),
      new THREE.Vector3(-8, 0.17, -4), new THREE.Vector3(6, 0.17, 4),
      new THREE.Vector3(4, 0.17, -12), new THREE.Vector3(12, 0.17, -2),
    ];
    const tracks = new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(trackPts),
      new THREE.LineBasicMaterial({ color: DISK_EDGE })
    );
    group.add(tracks);

    group.userData.mats = [{ mat: diskMat, from: 1, to: 0.5 }]; // 磁片爆炸态 0.5
    return group;
  }

  // ===================================================================
  // 7. HUB（中心金属盘）—— 圆盘 + 中央圆孔 + 方形卡口孔
  // ===================================================================
  function createHub() {
    const group = new THREE.Group();
    const shape = circleShape(0, 0, 5, 40); // 外圆
    shape.holes.push(circlePath(0, 0, 1.6, 24, true));   // 中央圆形孔（主轴）
    shape.holes.push(rectHole(1.4, -0.8, 3.0, 0.8));     // 旁边方形孔（主轴卡口）
    const geo = extrudeToXZ(shape, 0.35);
    const mesh = new THREE.Mesh(geo, ghostMat());
    const mats = [{ mat: mesh.material, from: 1, to: 0.08 }];
    addEdges(mesh);
    group.add(mesh);
    group.userData.mats = mats;
    return group;
  }

  // ===================================================================
  // 8. BOTTOM SHELL（下壳）—— 复合结构
  // ===================================================================
  function createBottomShell() {
    const group = new THREE.Group();
    const mats = [];

    const shape = chamferRectShape();
    // (b) 中央圆孔：直径 14（主轴孔）—— 真镂空
    shape.holes.push(circlePath(0, 0, 7, 32, true));
    // (f) WRITE PROTECT NOTCH：右后角 3×3 方形真镂空
    shape.holes.push(rectHole(25, 25, 28, 28));
    // (g) Shutter 开口槽：与上壳 (d) / 快门孔同一套参数，前边缘贯穿镂空
    shape.holes.push(rectHole(SLOT_X - SLOT_W / 2, SLOT_Z - SLOT_D / 2,
                              SLOT_X + SLOT_W / 2, SLOT_Z + SLOT_D / 2));

    const geo = extrudeToXZ(shape, SHELL_DEPTH);
    const shell = new THREE.Mesh(geo, ghostMat());
    mats.push({ mat: shell.material, from: 1, to: 0.08 });
    addEdges(shell);
    group.add(shell);

    // (a) 中央大圆形凹陷：直径 44 的薄圆环（带同轴圆孔），略低于上表面
    const recShape = circleShape(0, 0, 22, 48);
    recShape.holes.push(circlePath(0, 0, 7, 32, true));
    const recGeo = extrudeToXZ(recShape, 0.3);
    const recMesh = new THREE.Mesh(recGeo, ghostMat());
    recMesh.position.y = 0.8; // 0.65..0.95，低于表面 1.0
    mats.push({ mat: recMesh.material, from: 1, to: 0.08 });
    addEdges(recMesh);
    group.add(recMesh);

    // (c) 四角定位柱：半径 1.5 高 0.9 的小圆柱
    for (const [px, pz] of [[22.5, 22.5], [-22.5, 22.5], [22.5, -22.5], [-22.5, -22.5]]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.9, 24), ghostMat());
      post.position.set(px, 0.5, pz); // 0.05..0.95，低于表面
      mats.push({ mat: post.material, from: 1, to: 0.08 });
      addEdges(post);
      group.add(post);
    }

    // (d) LIFTER：中下方矩形凸起（高出表面，底面略高于表面 0.01 避免共面闪烁）
    mats.push({ mat: addBox(group, 8, 0.8, 4, 0, 1.41, -14).material, from: 1, to: 0.08 });

    // (e) SHUTTER SPRING 区：前边缘中部小矩形凹槽
    mats.push({ mat: addBox(group, 10, 0.3, 4, 0, 0.8, -26).material, from: 1, to: 0.08 });

    group.userData.mats = mats;
    return group;
  }

  // ===================================================================
  // 9. SHUTTER（金属滑盖）—— 不透明金属板 + 偏左矩形真镂空
  // ===================================================================
  // —— SELF-CHECK ——
  // 1. 快门本体为不透明 MeshBasicMaterial(#4a5568, transparent:false)，非半透明幽灵面。✓
  // 2. 开孔为单矩形真镂空（Shape+holes）；相对 22 长板面偏左（局部 x ∈ [-11,-5]）；
  //    开孔短边 6（沿 X）∥ 快门长边 22（沿 X），开孔长边 14（沿 Z）⊥ 快门长轴。✓
  // 3. 开孔与 TOP SHELL (d)、BOTTOM SHELL (g) 共用 SLOT_W/SLOT_D/SLOT_X/SLOT_Z；
  //    组装态（group 位于 (-14, -1.5, -22)）下三处世界坐标为 x∈[-25,-19], z∈[-29,-15] 完全重合。✓
  function createShutter() {
    const group = new THREE.Group();
    // 板面 22(X) × 16(Z)，厚 1；开孔 6(X) × 14(Z)，左偏
    const shape = new THREE.Shape();
    shape.moveTo(-11, -8); shape.lineTo(11, -8); shape.lineTo(11, 8); shape.lineTo(-11, 8);
    shape.closePath();
    shape.holes.push(rectHole(-11, -7, -5, 7));

    const geo = extrudeToXZ(shape, 1);
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: SHUTTER_COL, transparent: false // 不透明金属板
    }));
    addEdges(mesh); // 蓝色描边
    group.add(mesh);
    group.userData.mats = []; // 不参与透明度动画（始终不透明）
    return group;
  }

  // ===================================================================
  // 10. WRITE PROTECT TAB（防写入滑块）—— 3×2×3 小方块
  // ===================================================================
  function createWriteProtectTab() {
    const group = new THREE.Group();
    const box = addBox(group, 3, 2, 3, 0, 0, 0);
    group.userData.mats = [{ mat: box.material, from: 1, to: 0.08 }];
    return group;
  }

  // ===================================================================
  // 11. 构建所有部件并摆放（组装态位置）
  // ===================================================================
  const topShell    = createTopShell();    topShell.position.set(0, 1.5, 0);
  const topLiner    = createLiner();       topLiner.position.set(0, 1.0, 0);
  const disk        = createDisk();        disk.position.set(0, 0.5, 0);
  const hub         = createHub();         hub.position.set(0, 0.7, 0);
  const bottomLiner = createLiner();       bottomLiner.position.set(0, 0.0, 0);
  const bottomShell = createBottomShell(); bottomShell.position.set(0, -1.5, 0);
  const shutter     = createShutter();     shutter.position.set(-14, -1.5, -22); // 嵌入下壳前缘滑槽
  const wpTab       = createWriteProtectTab(); wpTab.position.set(26.5, -1.0, 26.5); // 右后角槽位

  for (const g of [topShell, topLiner, disk, hub, bottomLiner, bottomShell, shutter, wpTab]) {
    scene.add(g);
  }

  // ===================================================================
  // 12. 虚线连接（LineDashedMaterial）
  // ===================================================================
  const dashMat = new THREE.LineDashedMaterial({
    color: BLUE, dashSize: 2.5, gapSize: 2, transparent: true, opacity: 0
  });
  const dashGroup = new THREE.Group();
  dashGroup.visible = false;
  scene.add(dashGroup);

  function addDashedLine(from, to) {
    const g = new THREE.BufferGeometry().setFromPoints([from, to]);
    const line = new THREE.Line(g, dashMat);
    line.computeLineDistances(); // 虚线必须计算
    dashGroup.add(line);
  }
  // 4 条垂直虚线：穿过四个切角位置，贯穿 TOP SHELL → BOTTOM SHELL
  for (const [cx, cz] of [[28.5, 28.5], [-28.5, 28.5], [28.5, -28.5], [-28.5, -28.5]]) {
    addDashedLine(new THREE.Vector3(cx, 50, cz), new THREE.Vector3(cx, -20, cz));
  }
  // 快门 / 防写入滑块：斜向虚线连回下壳对应槽位
  addDashedLine(new THREE.Vector3(-30, -15, -30), new THREE.Vector3(-14, -15, -22));
  addDashedLine(new THREE.Vector3(45, -15, 45), new THREE.Vector3(26.5, -15, 26.5));

  // ===================================================================
  // 13. 文字标注（CSS2D）+ 引线
  // ===================================================================
  const labelGroup = new THREE.Group();
  labelGroup.visible = false;
  scene.add(labelGroup);

  // 顺序即淡入顺序（自上而下）
  const labelDefs = [
    { text: 'HD NOTCH',           anchor: [-38, 58, 34],  from: [-26, 45, 26]  },
    { text: 'TOP SHELL',          anchor: [ 36, 56,  8],  from: [  0, 45,  0]  },
    { text: 'DUST LINER (UPPER)', anchor: [-32, 36, 14],  from: [  0, 30,  0]  },
    { text: 'HUB',                anchor: [-28, 26, -10], from: [  0, 18,  0]  },
    { text: 'MAGNETIC DISK',      anchor: [ 30, 22, -6],  from: [  0, 15,  0]  },
    { text: 'DUST LINER (LOWER)', anchor: [-24,  8, -18], from: [  0,  0,  0]  },
    { text: 'LIFTER',             anchor: [  0, -2, -24], from: [  0, -13.6, -14] },
    { text: 'WRITE PROTECT NOTCH',anchor: [ 34, -2, 36],  from: [ 26.5, -15, 26.5] },
    { text: 'BOTTOM SHELL',       anchor: [ 28, -6, 18],  from: [  0, -15,  0]  },
    { text: 'SHUTTER SPRING',     anchor: [-14, -6, -36], from: [  0, -14.2, -26] },
    { text: 'SHUTTER',            anchor: [-46, -8, -34], from: [-30, -15, -30] },
    { text: 'WRITE PROTECT TAB',  anchor: [ 52, -8, 52],  from: [ 45, -15, 45]  },
  ];

  function makeLabel(def) {
    const div = document.createElement('div');
    div.className = 'c2d';
    const span = document.createElement('span');
    span.textContent = def.text;
    div.appendChild(span);
    const obj = new CSS2DObject(div);
    obj.position.set(def.anchor[0], def.anchor[1], def.anchor[2]);

    const leader = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(...def.from),
        new THREE.Vector3(...def.anchor),
      ]),
      new THREE.LineBasicMaterial({ color: BLUE, transparent: true, opacity: 0 })
    );
    labelGroup.add(obj);
    labelGroup.add(leader);
    return { textEl: span, leader };
  }
  const labels = labelDefs.map(makeLabel);

  // ===================================================================
  // ANIMATION: setupParts —— 收集可动部件与起止状态
  // ===================================================================
  const DUR = 3.0;        // 爆炸总时长（秒）
  const MAX_DELAY = 560;  // 最大错峰延迟（ms）

  const parts = [];
  function setupParts() {
    const defs = [
      { group: topShell,    from: [0, 1.5, 0],  to: [0, 45, 0],   delay: 0   },
      { group: topLiner,    from: [0, 1.0, 0],  to: [0, 30, 0],   delay: 80  },
      { group: hub,         from: [0, 0.7, 0],  to: [0, 18, 0],   delay: 160 },
      { group: disk,        from: [0, 0.5, 0],  to: [0, 15, 0],   delay: 240 },
      { group: bottomLiner, from: [0, 0.0, 0],  to: [0,  0, 0],   delay: 320 },
      { group: bottomShell, from: [0, -1.5, 0], to: [0, -15, 0],  delay: 400 },
      { group: shutter,     from: [-14, -1.5, -22], to: [-30, -15, -30], delay: 480 },
      { group: wpTab,       from: [26.5, -1.0, 26.5], to: [45, -15, 45],  delay: 560 },
    ];
    for (const d of defs) {
      parts.push({
        group: d.group,
        from: new THREE.Vector3(...d.from),
        to: new THREE.Vector3(...d.to),
        delay: d.delay / 1000,
        revDelay: (MAX_DELAY - d.delay) / 1000, // 收回时反向错峰
        mats: d.group.userData.mats,
      });
    }
  }
  setupParts();

  // ===================================================================
  // ANIMATION: setupControls —— OrbitControls（左旋转 / 中键+滚轮缩放 / 右平移）
  // ===================================================================
  function setupControls() {
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.mouseButtons.LEFT   = THREE.MOUSE.ROTATE;
    controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
    controls.mouseButtons.RIGHT  = THREE.MOUSE.PAN;

    controls.enableRotate = true;
    controls.enablePan = true;
    controls.enableZoom = true;          // 滚轮缩放默认可用
    controls.minZoom = 0.6;
    controls.maxZoom = 3.2;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);

    // 平移范围钳制：避免把软盘拖出画面过多
    let panGuard = false;
    controls.addEventListener('change', () => {
      if (panGuard) return;
      panGuard = true;
      const t = controls.target;
      t.x = Math.min(60, Math.max(-60, t.x));
      t.y = Math.min(60, Math.max(-30, t.y));
      t.z = Math.min(60, Math.max(-60, t.z));
      controls.update();
      panGuard = false;
    });

    // 禁止浏览器右键菜单遮挡平移操作
    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
    return controls;
  }
  const controls = setupControls();

  // ===================================================================
  // ANIMATION: 状态机与标签时序
  // ===================================================================
  let animState = 'assembled';   // 'assembled' | 'exploding' | 'exploded' | 'collapsing'
  let animT = 0;                 // 爆炸推进时间
  let collapseDelay = 0;         // 收回前标签淡出等待
  let collapseT = 0;
  let labelTL = null;            // 爆炸完成后的标注时间线 { t }

  function hideLabels() {
    labelGroup.visible = false;
    for (const l of labels) {
      l.textEl.style.opacity = 0;
      l.leader.material.opacity = 0;
    }
    dashGroup.visible = false;
    dashMat.opacity = 0;
  }

  function advanceLabelTimeline(t) {
    const DASH_START = 0.2, DASH_DUR = 0.6, LABEL_START = 1.0, LABEL_GAP = 0.06;
    if (t >= DASH_START) {
      dashGroup.visible = true;
      dashMat.opacity = easeInOutCubic(clamp01((t - DASH_START) / DASH_DUR));
    }
    if (t >= LABEL_START) {
      labelGroup.visible = true;
      for (let i = 0; i < labels.length; i++) {
        if (t >= LABEL_START + i * LABEL_GAP) {
          labels[i].textEl.style.opacity = 1;          // CSS 过渡自动淡入
          labels[i].leader.material.opacity = 1;       // 引线同步
        }
      }
    }
  }

  // ===================================================================
  // ANIMATION: triggerExplode / triggerCollapse
  // ===================================================================
  function triggerExplode() {
    if (animState !== 'assembled') return; // 动画进行中忽略
    hideLabels();
    animState = 'exploding';
    animT = 0;
    updateHint();
  }
  function triggerCollapse() {
    if (animState !== 'exploded') return;
    animState = 'collapsing';
    collapseDelay = 0.3; // 先让标注/虚线淡出（0.3s），再启动收回
    collapseT = 0;
    hideLabels();
    updateHint();
  }

  // ===================================================================
  // ANIMATION: updateAnimation —— 每帧推进位移 + 材质透明度插值
  // ===================================================================
  function updateAnimation(dt) {
    if (animState === 'exploding') {
      animT += dt;
      for (const p of parts) {
        const prog = clamp01((animT - p.delay) / DUR);
        if (prog > 0) {
          const e = easeInOutCubic(prog);
          p.group.position.lerpVectors(p.from, p.to, e);      // 位移
          for (const m of p.mats) {                            // 透明度同步
            m.mat.opacity = lerp(m.from, m.to, e);
          }
        }
      }
      if (animT >= DUR + MAX_DELAY / 1000) {
        animState = 'exploded';
        labelTL = { t: 0 }; // 爆炸完成：启动标注时序
      }
    } else if (animState === 'collapsing') {
      if (collapseDelay > 0) { collapseDelay -= dt; return; }
      collapseT += dt;
      for (const p of parts) {
        const prog = clamp01((collapseT - p.revDelay) / DUR); // 反向错峰
        if (prog > 0) {
          const e = 1 - easeInOutCubic(prog);                 // 1→0 收回
          p.group.position.lerpVectors(p.from, p.to, e);
          for (const m of p.mats) {
            m.mat.opacity = lerp(m.from, m.to, e);            // 反向插值回 1
          }
        }
      }
      if (collapseT >= DUR + MAX_DELAY / 1000) {
        animState = 'assembled';
        for (const p of parts) { // 精确复位，避免浮点残留
          p.group.position.copy(p.from);
          for (const m of p.mats) m.mat.opacity = m.from;
        }
        updateHint(); // 重新显示底部提示
      }
    } else if (animState === 'exploded' && labelTL) {
      labelTL.t += dt;
      advanceLabelTimeline(labelTL.t);
    }
  }

  // 底部提示：非 assembled 状态淡出
  function updateHint() {
    document.getElementById('hintWrap').style.opacity =
      animState === 'assembled' ? 1 : 0;
  }

  // ===================================================================
  // ANIMATION: explode trigger —— 空格键切换
  // ===================================================================
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault(); // 阻止页面滚动
      if (e.repeat) return;
      if (animState === 'assembled') triggerExplode();
      else if (animState === 'exploded') triggerCollapse();
      // 动画进行中（exploding / collapsing）忽略
    }
  });

  // ===================================================================
  // 渲染循环
  // ===================================================================
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05); // 防切后台大跳帧
    updateAnimation(dt);
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
  animate();

  // ===================================================================
  // 窗口缩放
  // ===================================================================
  window.addEventListener('resize', () => {
    updateFrustum();
    renderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    drawDotGrid();
  });
  </script>
</body>
</html>
