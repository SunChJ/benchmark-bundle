<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>FIG_001 — 3.5" Floppy Disk Exploded Blueprint</title>

  <style>
    :root {
      --blueprint: #4169e1;
      --background: #f5f7fa;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--background);
      font-family: "Courier New", Courier, monospace;
    }

    #dot-grid,
    #webgl-container,
    #label-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #dot-grid {
      z-index: 0;
      pointer-events: none;
    }

    #webgl-container {
      z-index: 1;
    }

    #label-container {
      z-index: 2;
      pointer-events: none;
    }

    .part-label {
      color: var(--blueprint);
      font-family: "Courier New", Courier, monospace;
      font-size: 12px;
      line-height: 1;
      letter-spacing: 0.06em;
      white-space: nowrap;
      opacity: 0;
      padding: 3px 5px;
      background: rgba(245, 247, 250, 0.78);
      border-left: 1px solid rgba(65, 105, 225, 0.55);
      transition: opacity 0.4s ease;
      pointer-events: none;
      user-select: none;
    }

    .side-caption {
      position: fixed;
      top: 50%;
      z-index: 4;
      color: rgba(65, 105, 225, 0.78);
      font-size: 12px;
      letter-spacing: 0.25em;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: translateY(-50%);
      pointer-events: none;
      user-select: none;
    }

    #figure-index {
      left: 18px;
    }

    #figure-name {
      right: 18px;
    }

    #interaction-ui {
      position: fixed;
      left: 50%;
      bottom: 20px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      transform: translateX(-50%);
      pointer-events: none;
      user-select: none;
    }

    #explode-prompt {
      color: var(--blueprint);
      font-size: 13px;
      letter-spacing: 0.13em;
      opacity: 0.65;
      transition: opacity 0.35s ease;
      animation: breathe 2.8s ease-in-out infinite;
    }

    #controls-hint {
      color: rgba(65, 105, 225, 0.47);
      font-size: 10px;
      letter-spacing: 0.09em;
    }

    @keyframes breathe {
      0%,
      100% {
        opacity: 0.35;
      }

      50% {
        opacity: 0.82;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <canvas id="dot-grid"></canvas>
  <div id="webgl-container"></div>
  <div id="label-container"></div>

  <div id="figure-index" class="side-caption">FIG_001</div>
  <div id="figure-name" class="side-caption">[ 3.5&quot; FLOPPY DISK ]</div>

  <div id="interaction-ui">
    <div id="explode-prompt">PRESS [ SPACE ] TO EXPLODE</div>
    <div id="controls-hint">LMB: ORBIT · WHEEL: ZOOM · RMB: PAN</div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import {
      CSS2DRenderer,
      CSS2DObject
    } from "three/addons/renderers/CSS2DRenderer.js";

    // ============================================================
    // CONSTANTS
    // ============================================================

    const BLUEPRINT_COLOR = 0x4169e1;
    const BLUEPRINT_FILL = 0xeaf0ff;
    const MAGNETIC_COLOR = 0x7b9df8;
    const SHUTTER_COLOR = 0x4a5568;

    const SHELL_WIDTH = 60;
    const SHELL_DEPTH = 60;
    const SHELL_THICKNESS = 2;
    const SHELL_CHAMFER = 3;

    /*
     * Shared magnetic-head channel definition.
     *
     * All three true holes reuse these dimensions:
     * 1. Top shell shutter opening
     * 2. Bottom shell shutter opening
     * 3. Metal shutter window
     *
     * Shutter long axis: X, 22 units.
     * Window X size: 6, parallel to shutter long edge.
     * Window Z size: 14, perpendicular to shutter long axis.
     */
    const HEAD_CHANNEL = Object.freeze({
      centerX: -6,
      centerZ: 22,
      widthX: 6,
      depthZ: 14
    });

    const SHUTTER_SIZE = Object.freeze({
      widthX: 22,
      depthZ: 16,
      thicknessY: 1
    });

    const webglContainer = document.getElementById("webgl-container");
    const labelContainer = document.getElementById("label-container");
    const promptElement = document.getElementById("explode-prompt");

    // ============================================================
    // SCENE / RENDERERS
    // ============================================================

    const scene = new THREE.Scene();

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0xf5f7fa, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    webglContainer.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = "absolute";
    labelRenderer.domElement.style.inset = "0";
    labelRenderer.domElement.style.pointerEvents = "none";
    labelContainer.appendChild(labelRenderer.domElement);

    const cameraFrustum = 120;
    const aspect = window.innerWidth / window.innerHeight;

    const camera = new THREE.OrthographicCamera(
      (-cameraFrustum * aspect) / 2,
      (cameraFrustum * aspect) / 2,
      cameraFrustum / 2,
      -cameraFrustum / 2,
      0.1,
      1000
    );

    camera.position.set(100, 80, 100);
    camera.lookAt(0, 0, 0);
    camera.zoom = 1.05;
    camera.updateProjectionMatrix();

    // ============================================================
    // DOT GRID BACKGROUND — DRAWN WITH CANVAS
    // ============================================================

    const dotGridCanvas = document.getElementById("dot-grid");
    const dotGridContext = dotGridCanvas.getContext("2d");

    function drawDotGrid() {
      const pixelRatio = Math.min(window.devicePixelRatio, 2);
      const width = window.innerWidth;
      const height = window.innerHeight;

      dotGridCanvas.width = Math.round(width * pixelRatio);
      dotGridCanvas.height = Math.round(height * pixelRatio);
      dotGridCanvas.style.width = `${width}px`;
      dotGridCanvas.style.height = `${height}px`;

      dotGridContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      dotGridContext.clearRect(0, 0, width, height);
      dotGridContext.fillStyle = "#f5f7fa";
      dotGridContext.fillRect(0, 0, width, height);

      const spacing = 24;
      const offsetX = (width % spacing) * 0.5;
      const offsetY = (height % spacing) * 0.5;

      dotGridContext.fillStyle = "rgba(65, 105, 225, 0.14)";

      for (let x = offsetX; x <= width; x += spacing) {
        for (let y = offsetY; y <= height; y += spacing) {
          dotGridContext.beginPath();
          dotGridContext.arc(x, y, 1, 0, Math.PI * 2);
          dotGridContext.fill();
        }
      }
    }

    drawDotGrid();

    // ============================================================
    // ORBIT CONTROLS
    // ============================================================

    let controls;

    function setupControls() {
      controls = new OrbitControls(camera, renderer.domElement);

      controls.enableRotate = true;
      controls.enablePan = true;
      controls.enableZoom = true;
      controls.enableDamping = true;
      controls.dampingFactor = 0.075;
      controls.screenSpacePanning = true;

      controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
      controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
      controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;

      controls.minZoom = 0.72;
      controls.maxZoom = 2.4;

      controls.minPolarAngle = 0.2;
      controls.maxPolarAngle = Math.PI * 0.88;

      controls.target.set(0, 10, 0);
      controls.update();

      renderer.domElement.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

      // Clamp the pan target while preserving camera-to-target offset.
      controls.addEventListener("change", () => {
        const originalTarget = controls.target.clone();

        controls.target.x = THREE.MathUtils.clamp(controls.target.x, -22, 22);
        controls.target.y = THREE.MathUtils.clamp(controls.target.y, -12, 28);
        controls.target.z = THREE.MathUtils.clamp(controls.target.z, -22, 22);

        const correction = controls.target.clone().sub(originalTarget);

        if (correction.lengthSq() > 0) {
          camera.position.add(correction);
        }
      });
    }

    setupControls();

    // ============================================================
    // BLUEPRINT MATERIAL / GEOMETRY UTILITIES
    // ============================================================

    function createFillMaterial(
      explodedOpacity = 0.08,
      color = BLUEPRINT_FILL
    ) {
      const material = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 1,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      material.userData.assembledOpacity = 1;
      material.userData.explodedOpacity = explodedOpacity;
      return material;
    }

    function createLineMaterial({
      color = BLUEPRINT_COLOR,
      opacity = 1,
      depthTest = false
    } = {}) {
      return new THREE.LineBasicMaterial({
        color,
        transparent: true,
        opacity,
        depthTest
      });
    }

    function addEdgedMesh(
      parent,
      geometry,
      {
        fillMaterial = createFillMaterial(),
        edgeColor = BLUEPRINT_COLOR,
        edgeOpacity = 1,
        edgeThreshold = 15,
        position = new THREE.Vector3(),
        rotation = new THREE.Euler()
      } = {}
    ) {
      const component = new THREE.Group();

      const mesh = new THREE.Mesh(geometry, fillMaterial);
      mesh.position.copy(position);
      mesh.rotation.copy(rotation);
      component.add(mesh);

      const edgesGeometry = new THREE.EdgesGeometry(
        geometry,
        edgeThreshold
      );

      const edges = new THREE.LineSegments(
        edgesGeometry,
        createLineMaterial({
          color: edgeColor,
          opacity: edgeOpacity,
          depthTest: false
        })
      );

      edges.position.copy(position);
      edges.rotation.copy(rotation);
      edges.renderOrder = 10;
      component.add(edges);

      parent.add(component);
      return component;
    }

    function createPolyline(points, material = createLineMaterial()) {
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geometry, material);
      line.renderOrder = 20;
      return line;
    }

    function createDashedLine(points) {
      const geometry = new THREE.BufferGeometry().setFromPoints(points);

      const material = new THREE.LineDashedMaterial({
        color: BLUEPRINT_COLOR,
        dashSize: 2,
        gapSize: 1.5,
        transparent: true,
        opacity: 0,
        depthTest: false
      });

      const line = new THREE.Line(geometry, material);
      line.computeLineDistances();
      line.visible = false;
      line.renderOrder = 30;
      return line;
    }

    /*
     * Shape coordinates use X/Y.
     * After rotateX(-PI / 2), shape Y maps to world -Z.
     */
    function addRectangularHole(
      shape,
      centerX,
      centerZ,
      widthX,
      depthZ
    ) {
      const centerY = -centerZ;
      const halfWidth = widthX / 2;
      const halfDepth = depthZ / 2;

      // Clockwise path for a hole.
      const hole = new THREE.Path();
      hole.moveTo(centerX - halfWidth, centerY - halfDepth);
      hole.lineTo(centerX - halfWidth, centerY + halfDepth);
      hole.lineTo(centerX + halfWidth, centerY + halfDepth);
      hole.lineTo(centerX + halfWidth, centerY - halfDepth);
      hole.closePath();

      shape.holes.push(hole);
      return hole;
    }

    function addCircularHole(shape, centerX, centerZ, radius) {
      const hole = new THREE.Path();
      hole.absarc(centerX, -centerZ, radius, 0, Math.PI * 2, true);
      shape.holes.push(hole);
      return hole;
    }

    function createChamferedShellShape() {
      const halfWidth = SHELL_WIDTH / 2;
      const halfDepth = SHELL_DEPTH / 2;
      const c = SHELL_CHAMFER;

      const shape = new THREE.Shape();

      shape.moveTo(-halfWidth + c, -halfDepth);
      shape.lineTo(halfWidth - c, -halfDepth);
      shape.lineTo(halfWidth, -halfDepth + c);
      shape.lineTo(halfWidth, halfDepth - c);
      shape.lineTo(halfWidth - c, halfDepth);
      shape.lineTo(-halfWidth + c, halfDepth);
      shape.lineTo(-halfWidth, halfDepth - c);
      shape.lineTo(-halfWidth, -halfDepth + c);
      shape.closePath();

      return shape;
    }

    function extrudeHorizontalShape(shape, depth) {
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: false,
        curveSegments: 48
      });

      geometry.rotateX(-Math.PI / 2);
      geometry.computeVertexNormals();
      return geometry;
    }

    // ============================================================
    // TOP SHELL — COMPOUND GROUP
    // ============================================================

    function createTopShell() {
      const group = new THREE.Group();
      group.name = "TOP SHELL";

      const shellShape = createChamferedShellShape();

      // (a) HD NOTCH — true square hole.
      addRectangularHole(shellShape, -25, -25, 4, 4);

      // (d) Shared shutter/head channel — true rectangular hole.
      addRectangularHole(
        shellShape,
        HEAD_CHANNEL.centerX,
        HEAD_CHANNEL.centerZ,
        HEAD_CHANNEL.widthX,
        HEAD_CHANNEL.depthZ
      );

      const bodyGeometry = extrudeHorizontalShape(
        shellShape,
        SHELL_THICKNESS
      );

      addEdgedMesh(group, bodyGeometry, {
        fillMaterial: createFillMaterial(0.08)
      });

      // (b) Large recessed label panel.
      addEdgedMesh(
        group,
        new THREE.BoxGeometry(36, 0.08, 22),
        {
          fillMaterial: createFillMaterial(0.08),
          position: new THREE.Vector3(3, 1.97, -10)
        }
      );

      // Inner inset border gives the label recess a technical double-line.
      addEdgedMesh(
        group,
        new THREE.BoxGeometry(32, 0.045, 18),
        {
          fillMaterial: createFillMaterial(0.08),
          position: new THREE.Vector3(3, 1.99, -10)
        }
      );

      // (c) Smaller shutter sliding recess below label area.
      addEdgedMesh(
        group,
        new THREE.BoxGeometry(20, 0.07, 10),
        {
          fillMaterial: createFillMaterial(0.08),
          position: new THREE.Vector3(-3, 1.98, 9)
        }
      );

      // Additional shallow rail lines surrounding the shutter path.
      const railMaterial = createLineMaterial();

      group.add(
        createPolyline(
          [
            new THREE.Vector3(-17, 2.045, 14),
            new THREE.Vector3(6, 2.045, 14)
          ],
          railMaterial
        )
      );

      group.add(
        createPolyline(
          [
            new THREE.Vector3(-17, 2.045, 29),
            new THREE.Vector3(6, 2.045, 29)
          ],
          railMaterial.clone()
        )
      );

      // (e) Direction arrow near the shutter opening.
      const arrowY = 2.08;
      const arrow = createPolyline(
        [
          new THREE.Vector3(5, arrowY, 21),
          new THREE.Vector3(10, arrowY, 21),
          new THREE.Vector3(8, arrowY, 19),
          new THREE.Vector3(10, arrowY, 21),
          new THREE.Vector3(8, arrowY, 23)
        ],
        createLineMaterial()
      );

      group.add(arrow);

      return group;
    }

    // ============================================================
    // DUST LINER
    // ============================================================

    function createDustLiner(name) {
      const group = new THREE.Group();
      group.name = name;

      const shape = new THREE.Shape();
      shape.absarc(0, 0, 24, 0, Math.PI * 2, false);

      // Inner circular hole forms the annular fabric liner.
      const innerHole = new THREE.Path();
      innerHole.absarc(0, 0, 15.5, 0, Math.PI * 2, true);
      shape.holes.push(innerHole);

      // Rectangular magnetic-head cutout.
      addRectangularHole(
        shape,
        HEAD_CHANNEL.centerX,
        18,
        HEAD_CHANNEL.widthX,
        10
      );

      const geometry = extrudeHorizontalShape(shape, 0.18);

      addEdgedMesh(group, geometry, {
        fillMaterial: createFillMaterial(0.08)
      });

      return group;
    }

    // ============================================================
    // MAGNETIC DISK
    // ============================================================

    function createMagneticDisk() {
      const group = new THREE.Group();
      group.name = "MAGNETIC DISK";

      const geometry = new THREE.CylinderGeometry(
        22,
        22,
        0.3,
        96,
        1,
        false
      );

      addEdgedMesh(group, geometry, {
        fillMaterial: createFillMaterial(0.5, MAGNETIC_COLOR),
        edgeColor: 0x3156c9,
        edgeThreshold: 5
      });

      // Short reflective/data-track strokes.
      const trackMaterial = createLineMaterial({
        color: 0x3156c9,
        opacity: 0.9
      });

      [
        [
          new THREE.Vector3(-16, 0.18, -5),
          new THREE.Vector3(-10, 0.18, -2)
        ],
        [
          new THREE.Vector3(9, 0.18, 12),
          new THREE.Vector3(15, 0.18, 8)
        ],
        [
          new THREE.Vector3(11, 0.18, -11),
          new THREE.Vector3(16, 0.18, -7)
        ]
      ].forEach((points) => {
        group.add(createPolyline(points, trackMaterial.clone()));
      });

      return group;
    }

    // ============================================================
    // HUB
    // ============================================================

    function createHub() {
      const group = new THREE.Group();
      group.name = "HUB";

      const shape = new THREE.Shape();
      shape.absarc(0, 0, 5, 0, Math.PI * 2, false);

      // Central spindle hole.
      addCircularHole(shape, -0.8, 0, 1.25);

      // Adjacent square drive-index hole.
      addRectangularHole(shape, 2.5, 0, 1.8, 1.8);

      const geometry = extrudeHorizontalShape(shape, 0.4);

      addEdgedMesh(group, geometry, {
        fillMaterial: createFillMaterial(0.08, 0xdce5fb),
        edgeThreshold: 5
      });

      return group;
    }

    // ============================================================
    // BOTTOM SHELL — COMPOUND GROUP
    // ============================================================

    function createBottomShell() {
      const group = new THREE.Group();
      group.name = "BOTTOM SHELL";

      const shellShape = createChamferedShellShape();

      // (b) Central spindle hole — true circular hole.
      addCircularHole(shellShape, 0, 0, 7);

      // (f) Write-protect notch — true square hole.
      addRectangularHole(shellShape, 25, -25, 3, 3);

      // (g) Shared shutter/head channel — true rectangular hole.
      addRectangularHole(
        shellShape,
        HEAD_CHANNEL.centerX,
        HEAD_CHANNEL.centerZ,
        HEAD_CHANNEL.widthX,
        HEAD_CHANNEL.depthZ
      );

      const bodyGeometry = extrudeHorizontalShape(
        shellShape,
        SHELL_THICKNESS
      );

      addEdgedMesh(group, bodyGeometry, {
        fillMaterial: createFillMaterial(0.08)
      });

      // (a) Central circular disk recess.
      addEdgedMesh(
        group,
        new THREE.CylinderGeometry(22, 22, 0.08, 96),
        {
          fillMaterial: createFillMaterial(0.08),
          position: new THREE.Vector3(0, 2.02, 0),
          edgeThreshold: 5
        }
      );

      // Inner circular technical ring around spindle opening.
      addEdgedMesh(
        group,
        new THREE.CylinderGeometry(8.5, 8.5, 0.055, 64),
        {
          fillMaterial: createFillMaterial(0.08),
          position: new THREE.Vector3(0, 2.07, 0),
          edgeThreshold: 5
        }
      );

      // (c) Four screw/location posts.
      const postPositions = [
        [-24, -23],
        [24, -23],
        [-24, 23],
        [24, 23]
      ];

      postPositions.forEach(([x, z]) => {
        addEdgedMesh(
          group,
          new THREE.CylinderGeometry(1.5, 1.5, 1, 24),
          {
            fillMaterial: createFillMaterial(0.08),
            position: new THREE.Vector3(x, 2.5, z),
            edgeThreshold: 8
          }
        );
      });

      // (d) LIFTER.
      addEdgedMesh(
        group,
        new THREE.BoxGeometry(8, 1, 4),
        {
          fillMaterial: createFillMaterial(0.08),
          position: new THREE.Vector3(7, 2.5, 15)
        }
      );

      // (e) SHUTTER SPRING recessed region.
      addEdgedMesh(
        group,
        new THREE.BoxGeometry(10, 0.08, 4),
        {
          fillMaterial: createFillMaterial(0.08),
          position: new THREE.Vector3(13, 1.98, 25)
        }
      );

      // Small spring zig-zag engineering mark.
      const springPoints = [
        new THREE.Vector3(9, 2.08, 25),
        new THREE.Vector3(11, 2.08, 23.7),
        new THREE.Vector3(13, 2.08, 26.3),
        new THREE.Vector3(15, 2.08, 23.7),
        new THREE.Vector3(17, 2.08, 25)
      ];

      group.add(
        createPolyline(springPoints, createLineMaterial())
      );

      return group;
    }

    // ============================================================
    // SHUTTER — OPAQUE METAL, TRUE OFFSET RECTANGULAR HOLE
    // ============================================================

    function createShutter() {
      const group = new THREE.Group();
      group.name = "SHUTTER";

      const halfWidth = SHUTTER_SIZE.widthX / 2;
      const halfDepth = SHUTTER_SIZE.depthZ / 2;

      const shape = new THREE.Shape();
      shape.moveTo(-halfWidth, -halfDepth);
      shape.lineTo(halfWidth, -halfDepth);
      shape.lineTo(halfWidth, halfDepth);
      shape.lineTo(-halfWidth, halfDepth);
      shape.closePath();

      /*
       * Window center is local X = HEAD_CHANNEL.centerX.
       * The assembled shutter group is translated to centerZ = 22,
       * so this hole overlaps both shell openings exactly.
       */
      addRectangularHole(
        shape,
        HEAD_CHANNEL.centerX,
        0,
        HEAD_CHANNEL.widthX,
        HEAD_CHANNEL.depthZ
      );

      const geometry = extrudeHorizontalShape(
        shape,
        SHUTTER_SIZE.thicknessY
      );

      const metalMaterial = new THREE.MeshBasicMaterial({
        color: SHUTTER_COLOR,
        transparent: true,
        opacity: 1,
        side: THREE.DoubleSide,
        depthWrite: true
      });

      // Shutter remains opaque in both states.
      metalMaterial.userData.assembledOpacity = 1;
      metalMaterial.userData.explodedOpacity = 1;

      addEdgedMesh(group, geometry, {
        fillMaterial: metalMaterial,
        edgeColor: BLUEPRINT_COLOR,
        edgeThreshold: 5
      });

      // Opaque folded rail lips suggest a U-shaped metal wrap.
      [-halfDepth + 0.45, halfDepth - 0.45].forEach((z) => {
        const lipMaterial = metalMaterial.clone();
        lipMaterial.userData.assembledOpacity = 1;
        lipMaterial.userData.explodedOpacity = 1;

        addEdgedMesh(
          group,
          new THREE.BoxGeometry(
            SHUTTER_SIZE.widthX,
            0.55,
            0.9
          ),
          {
            fillMaterial: lipMaterial,
            edgeColor: BLUEPRINT_COLOR,
            position: new THREE.Vector3(
              0,
              SHUTTER_SIZE.thicknessY + 0.2,
              z
            )
          }
        );
      });

      return group;
    }

    // ============================================================
    // WRITE-PROTECT TAB
    // ============================================================

    function createWriteProtectTab() {
      const group = new THREE.Group();
      group.name = "WRITE PROTECT TAB";

      addEdgedMesh(
        group,
        new THREE.BoxGeometry(3, 2, 3),
        {
          fillMaterial: createFillMaterial(0.08)
        }
      );

      return group;
    }

    // ============================================================
    // BUILD MODEL
    // ============================================================

    const topShell = createTopShell();
    const upperLiner = createDustLiner("DUST LINER — TOP");
    const magneticDisk = createMagneticDisk();
    const hub = createHub();
    const lowerLiner = createDustLiner("DUST LINER — BOTTOM");
    const bottomShell = createBottomShell();
    const shutter = createShutter();
    const writeProtectTab = createWriteProtectTab();

    scene.add(
      topShell,
      upperLiner,
      magneticDisk,
      hub,
      lowerLiner,
      bottomShell,
      shutter,
      writeProtectTab
    );

    // ============================================================
    // PART STATE TABLE
    // ============================================================

    const parts = [];

    function collectPartMaterials(group) {
      const materials = [];

      group.traverse((object) => {
        if (!object.isMesh) return;

        const objectMaterials = Array.isArray(object.material)
          ? object.material
          : [object.material];

        objectMaterials.forEach((material) => {
          if (!material || materials.includes(material)) return;

          materials.push({
            material,
            assembledOpacity:
              material.userData.assembledOpacity ?? 1,
            explodedOpacity:
              material.userData.explodedOpacity ?? 0.08
          });
        });
      });

      return materials;
    }

    function registerPart(
      group,
      assembledPosition,
      explodedPosition,
      delay
    ) {
      group.position.copy(assembledPosition);

      parts.push({
        group,
        assembledPosition: assembledPosition.clone(),
        explodedPosition: explodedPosition.clone(),
        delay,
        materials: collectPartMaterials(group)
      });
    }

    function setupParts() {
      registerPart(
        topShell,
        new THREE.Vector3(0, 1.5, 0),
        new THREE.Vector3(0, 45, 0),
        0
      );

      registerPart(
        upperLiner,
        new THREE.Vector3(0, 1, 0),
        new THREE.Vector3(0, 30, 0),
        80
      );

      registerPart(
        magneticDisk,
        new THREE.Vector3(0, 0.5, 0),
        new THREE.Vector3(0, 15, 0),
        160
      );

      registerPart(
        hub,
        new THREE.Vector3(0, 0.7, 0),
        new THREE.Vector3(0, 18, 0),
        240
      );

      registerPart(
        lowerLiner,
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, 0),
        320
      );

      registerPart(
        shutter,
        new THREE.Vector3(0, -1.5, HEAD_CHANNEL.centerZ),
        new THREE.Vector3(-38, -15, 42),
        400
      );

      registerPart(
        writeProtectTab,
        new THREE.Vector3(25, -1, -25),
        new THREE.Vector3(40, -15, -40),
        480
      );

      registerPart(
        bottomShell,
        new THREE.Vector3(0, -1.5, 0),
        new THREE.Vector3(0, -15, 0),
        560
      );
    }

    setupParts();

    // ============================================================
    // EXPLODED-STATE GUIDE LINES
    // ============================================================

    const guideLines = [];

    const guideCornerPositions = [
      [-27, -27],
      [27, -27],
      [-27, 27],
      [27, 27]
    ];

    guideCornerPositions.forEach(([x, z]) => {
      const line = createDashedLine([
        new THREE.Vector3(x, -16, z),
        new THREE.Vector3(x, 48, z)
      ]);

      scene.add(line);
      guideLines.push(line);
    });

    // Shutter-to-bottom-shell diagonal guide.
    const shutterGuide = createDashedLine([
      new THREE.Vector3(-38, -14.4, 42),
      new THREE.Vector3(-11, -13.5, 28)
    ]);

    scene.add(shutterGuide);
    guideLines.push(shutterGuide);

    // Write-protect-tab diagonal guide.
    const tabGuide = createDashedLine([
      new THREE.Vector3(40, -14, -40),
      new THREE.Vector3(25, -13, -25)
    ]);

    scene.add(tabGuide);
    guideLines.push(tabGuide);

    // ============================================================
    // CSS2D LABELS AND LEADER LINES
    // ============================================================

    const labels = [];
    const leaderLines = [];

    function addPartLabel(text, targetPosition, labelPosition) {
      const element = document.createElement("div");
      element.className = "part-label";
      element.textContent = text;
      element.style.opacity = "0";

      const labelObject = new CSS2DObject(element);
      labelObject.position.copy(labelPosition);
      labelObject.visible = false;
      scene.add(labelObject);

      const direction = labelPosition.x >= targetPosition.x ? 1 : -1;
      const elbowPosition = new THREE.Vector3(
        labelPosition.x - direction * 5,
        labelPosition.y,
        labelPosition.z
      );

      const leader = createPolyline(
        [
          targetPosition,
          elbowPosition,
          labelPosition
        ],
        createLineMaterial({
          opacity: 0,
          depthTest: false
        })
      );

      leader.visible = false;
      scene.add(leader);

      labels.push({
        object: labelObject,
        element,
        leader
      });

      leaderLines.push(leader);
    }

    // Ordered approximately from top to bottom for staggered reveal.
    addPartLabel(
      "HD NOTCH",
      new THREE.Vector3(-25, 47.1, -25),
      new THREE.Vector3(-43, 50, -25)
    );

    addPartLabel(
      "TOP SHELL",
      new THREE.Vector3(27, 46.5, -8),
      new THREE.Vector3(42, 48, -8)
    );

    addPartLabel(
      "DUST LINER",
      new THREE.Vector3(-21, 30.2, -4),
      new THREE.Vector3(-42, 33, -4)
    );

    addPartLabel(
      "HUB",
      new THREE.Vector3(4, 18.4, 1),
      new THREE.Vector3(27, 21, 1)
    );

    addPartLabel(
      "MAGNETIC DISK",
      new THREE.Vector3(19, 15.2, -7),
      new THREE.Vector3(39, 16, -7)
    );

    addPartLabel(
      "DUST LINER",
      new THREE.Vector3(-21, 0.2, 3),
      new THREE.Vector3(-42, 3, 3)
    );

    addPartLabel(
      "BOTTOM SHELL",
      new THREE.Vector3(26, -13, -8),
      new THREE.Vector3(43, -10, -8)
    );

    addPartLabel(
      "LIFTER",
      new THREE.Vector3(7, -12, 15),
      new THREE.Vector3(30, -5, 15)
    );

    addPartLabel(
      "SHUTTER SPRING",
      new THREE.Vector3(13, -13, 25),
      new THREE.Vector3(39, -8, 25)
    );

    addPartLabel(
      "WRITE PROTECT NOTCH",
      new THREE.Vector3(25, -13, -25),
      new THREE.Vector3(43, -7, -25)
    );

    addPartLabel(
      "SHUTTER",
      new THREE.Vector3(-38, -14, 42),
      new THREE.Vector3(-55, -9, 42)
    );

    addPartLabel(
      "WRITE PROTECT TAB",
      new THREE.Vector3(40, -14, -40),
      new THREE.Vector3(49, -18, -40)
    );

    // ============================================================
    // ANIMATION STATE MACHINE
    // ============================================================

    let animState = "assembled";
    let animationRunning = false;
    let animationElapsed = 0;

    const animationDuration = 3000;
    const maximumPartDelay = Math.max(...parts.map((part) => part.delay));
    const partTravelDuration = animationDuration - maximumPartDelay;

    const scheduledTimers = new Set();
    const materialTweens = [];

    function easeInOutCubic(value) {
      return value < 0.5
        ? 4 * value * value * value
        : 1 - Math.pow(-2 * value + 2, 3) / 2;
    }

    function schedule(callback, delay) {
      const timer = window.setTimeout(() => {
        scheduledTimers.delete(timer);
        callback();
      }, delay);

      scheduledTimers.add(timer);
      return timer;
    }

    function clearScheduledTimers() {
      scheduledTimers.forEach((timer) => window.clearTimeout(timer));
      scheduledTimers.clear();
    }

    function tweenOpacity(material, to, duration = 400) {
      materialTweens.push({
        material,
        from: material.opacity,
        to,
        start: performance.now(),
        duration
      });
    }

    function updateOpacityTweens(now) {
      for (let index = materialTweens.length - 1; index >= 0; index--) {
        const tween = materialTweens[index];
        const progress = THREE.MathUtils.clamp(
          (now - tween.start) / tween.duration,
          0,
          1
        );

        tween.material.opacity = THREE.MathUtils.lerp(
          tween.from,
          tween.to,
          easeInOutCubic(progress)
        );

        if (progress >= 1) {
          materialTweens.splice(index, 1);
        }
      }
    }

    // === ANIMATION: label reveal ===

    function showLabels() {
      clearScheduledTimers();

      guideLines.forEach((line) => {
        line.visible = true;
        line.material.opacity = 0;
      });

      schedule(() => {
        guideLines.forEach((line) => {
          tweenOpacity(line.material, 0.78, 420);
        });
      }, 200);

      labels.forEach((entry, index) => {
        schedule(() => {
          entry.object.visible = true;
          entry.leader.visible = true;
          entry.leader.material.opacity = 0;

          requestAnimationFrame(() => {
            entry.element.style.opacity = "1";
          });

          tweenOpacity(entry.leader.material, 0.9, 360);
        }, 400 + index * 60);
      });
    }

    // === ANIMATION: label hide ===

    function hideLabels() {
      clearScheduledTimers();

      labels.forEach((entry) => {
        entry.element.style.opacity = "0";

        if (entry.leader.visible) {
          tweenOpacity(entry.leader.material, 0, 300);
        }
      });

      guideLines.forEach((line) => {
        if (line.visible) {
          tweenOpacity(line.material, 0, 300);
        }
      });

      schedule(() => {
        labels.forEach((entry) => {
          entry.object.visible = false;
          entry.leader.visible = false;
        });

        guideLines.forEach((line) => {
          line.visible = false;
        });
      }, 340);
    }

    // === ANIMATION: explode trigger ===

    function triggerExplode() {
      if (animState !== "assembled" || animationRunning) return;

      clearScheduledTimers();
      animState = "exploding";
      animationRunning = true;
      animationElapsed = 0;
      promptElement.style.opacity = "0";
    }

    // === ANIMATION: collapse trigger ===

    function triggerCollapse() {
      if (animState !== "exploded" || animationRunning) return;

      animState = "collapsing";
      animationRunning = false;
      animationElapsed = 0;
      hideLabels();

      // Labels and guides fade before physical collapse begins.
      schedule(() => {
        animationRunning = true;
        animationElapsed = 0;
      }, 340);
    }

    function applyPartState(part, explosionAmount) {
      part.group.position.lerpVectors(
        part.assembledPosition,
        part.explodedPosition,
        explosionAmount
      );

      part.materials.forEach(
        ({
          material,
          assembledOpacity,
          explodedOpacity
        }) => {
          material.opacity = THREE.MathUtils.lerp(
            assembledOpacity,
            explodedOpacity,
            explosionAmount
          );
        }
      );
    }

    // === ANIMATION: per-frame position and opacity interpolation ===

    function updateAnimation(deltaTime) {
      if (!animationRunning) return;

      animationElapsed += deltaTime * 1000;

      parts.forEach((part) => {
        let localProgress;

        if (animState === "exploding") {
          localProgress = THREE.MathUtils.clamp(
            (animationElapsed - part.delay) / partTravelDuration,
            0,
            1
          );

          applyPartState(part, easeInOutCubic(localProgress));
        } else if (animState === "collapsing") {
          // Reverse stagger: lower parts begin returning first.
          const reverseDelay = maximumPartDelay - part.delay;

          localProgress = THREE.MathUtils.clamp(
            (animationElapsed - reverseDelay) / partTravelDuration,
            0,
            1
          );

          applyPartState(
            part,
            1 - easeInOutCubic(localProgress)
          );
        }
      });

      if (animationElapsed < animationDuration) return;

      animationRunning = false;

      if (animState === "exploding") {
        parts.forEach((part) => applyPartState(part, 1));
        animState = "exploded";
        showLabels();
      } else if (animState === "collapsing") {
        parts.forEach((part) => applyPartState(part, 0));
        animState = "assembled";
        promptElement.style.opacity = "";
      }
    }

    window.addEventListener("keydown", (event) => {
      if (event.code !== "Space" || event.repeat) return;

      event.preventDefault();

      if (animState === "assembled") {
        triggerExplode();
      } else if (animState === "exploded") {
        triggerCollapse();
      }
      // Space is deliberately ignored during exploding/collapsing.
    });

    // ============================================================
    // RESIZE
    // ============================================================

    function handleResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const nextAspect = width / height;

      camera.left = (-cameraFrustum * nextAspect) / 2;
      camera.right = (cameraFrustum * nextAspect) / 2;
      camera.top = cameraFrustum / 2;
      camera.bottom = -cameraFrustum / 2;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      labelRenderer.setSize(width, height);
      drawDotGrid();
    }

    window.addEventListener("resize", handleResize);

    // ============================================================
    // RENDER LOOP
    // ============================================================

    const clock = new THREE.Clock();

    function animate(now) {
      requestAnimationFrame(animate);

      const deltaTime = Math.min(clock.getDelta(), 0.05);

      updateAnimation(deltaTime);
      updateOpacityTweens(now);
      controls.update();

      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    /*
     * ============================================================
     * SHUTTER / OPENING SELF-CHECK
     * ============================================================
     *
     * [1] SHUTTER is rendered with an opaque MeshBasicMaterial:
     *     assembledOpacity = 1 and explodedOpacity = 1.
     *
     * [2] SHUTTER has a true rectangular Shape hole.
     *     It is offset left at local X = -6.
     *     Shutter long axis is X.
     *     Hole X edge = 6, parallel to the shutter long edge.
     *     Hole Z edge = 14, perpendicular to the shutter long axis.
     *
     * [3] TOP SHELL, BOTTOM SHELL, and SHUTTER all reuse the same
     *     immutable HEAD_CHANNEL dimensions. In assembled state,
     *     the shutter group is translated to HEAD_CHANNEL.centerZ,
     *     causing all three holes to overlap in X/Z.
     * ============================================================
     */
  </script>
</body>
</html>
